    <form action="{% url 'carpool:search' %}" method="get" class="search-form">
        <!-- Unified container for stacked input fields -->
        <div class="search-fields-group">
            
            <!-- Field 1: Neighborhood -->
            <div class="search-input-wrapper">
                <span class="field-icon">📍</span>
                <input type="text" name="neighbourhood" placeholder="Enter your neighborhood (e.g., Downtown)..." value="{{ request.GET.neighbourhood }}">
            </div>
            
            <!-- Separator Line -->
            <div class="field-separator"></div>

            <!-- Field 2: School -->
            <div class="search-input-wrapper">
                <span class="field-icon">🏫</span>
                <input type="text" name="school" placeholder="Enter school name (e.g., Lincoln High)..." value="{{ request.GET.school }}">
            </div>
            
        </div>
        
        <button type="submit">Find Communities</button>
    </form>


</section>
{% endblock %}
